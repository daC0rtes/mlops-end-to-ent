name: Build property API image

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "api/**"
      - ".github/workflows/build-property-api.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-property-api:sha-${{ github.sha }}

      - name: Update GitOps image tag
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: dac0rtes/mlops-property-api:sha-[^[:space:]]*|image: dac0rtes/mlops-property-api:sha-${GITHUB_SHA}|" k8s/base/api.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/api.yaml
          git commit -m "deploy: update property API image to ${GITHUB_SHA}"
          git push
