apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mlops
data:
  TZ: America/Bogota
  01-init.sql: |
    CREATE SCHEMA IF NOT EXISTS raw;
    CREATE SCHEMA IF NOT EXISTS clean;
    CREATE SCHEMA IF NOT EXISTS mlops;

    CREATE TABLE IF NOT EXISTS raw.patient_records (
      id BIGSERIAL PRIMARY KEY,
      batch_id TEXT NOT NULL,
      source_file TEXT NOT NULL,
      row_hash TEXT NOT NULL UNIQUE,
      payload JSONB NOT NULL,
      record_status TEXT NOT NULL DEFAULT 'loaded',
      loaded_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS clean.patient_features (
      id BIGSERIAL PRIMARY KEY,
      raw_record_id BIGINT REFERENCES raw.patient_records(id),
      batch_id TEXT NOT NULL,
      features JSONB NOT NULL,
      target TEXT,
      transformed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS mlops.inference_logs (
      request_id UUID PRIMARY KEY,
      requested_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      input_payload JSONB NOT NULL,
      prediction TEXT NOT NULL,
      score DOUBLE PRECISION,
      model_name TEXT NOT NULL,
      model_version TEXT NOT NULL,
      latency_ms DOUBLE PRECISION NOT NULL
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: mlops
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mlops
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mlops
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: postgres-init
                  key: TZ
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
