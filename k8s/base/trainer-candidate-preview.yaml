apiVersion: batch/v1
kind: Job
metadata:
  generateName: property-candidate-preview-
  namespace: mlops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: property-candidate-preview
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: dac0rtes/mlops-property-trainer:sha-REPLACE_WITH_BUILD_SHA
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_COMMIT
              value: "REPLACE_WITH_BUILD_SHA"
            - name: CANDIDATE_BATCH_ID
              value: group-5-batch-5
            - name: TRAINING_REASON
              value: house_size_distribution_changed
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
