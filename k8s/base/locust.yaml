apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-script
  namespace: mlops
data:
  locustfile.py: |
    from locust import HttpUser, between, task

    EXAMPLE_PROPERTY = {
        "brokered_by": 101640,
        "bed": 4,
        "bath": 2.0,
        "acre_lot": 0.38,
        "street": 1758218,
        "zip_code": 6016,
        "house_size": 1617,
        "prev_sold_year": 1999,
        "status": "for_sale",
        "city": "East Windsor",
        "state": "Connecticut",
    }

    class PropertyApiUser(HttpUser):
        wait_time = between(0.5, 1.5)

        @task(4)
        def predict_price(self):
            with self.client.post(
                "/predict",
                json={"features": EXAMPLE_PROPERTY},
                name="/predict",
                catch_response=True,
            ) as response:
                if response.status_code == 200:
                    response.success()
                else:
                    response.failure(
                        f"Estado inesperado: {response.status_code} - {response.text}"
                    )

        @task(1)
        def health(self):
            self.client.get("/health", name="/health")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.47.0
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --host=http://property-api:8000
            - --web-host=0.0.0.0
            - --web-port=8089
          ports:
            - name: http
              containerPort: 8089
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: script
              mountPath: /mnt/locust
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: locust-script
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: mlops
spec:
  selector:
    app: locust
  ports:
    - name: http
      port: 8089
      targetPort: http
