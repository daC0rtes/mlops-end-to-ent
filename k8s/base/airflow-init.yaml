apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: mlops
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: airflow-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: dac0rtes/mlops-airflow@sha256:c5d26001a298ed4155efc49ff5b210e7619162e27e2fbb76e31132f3c3823d7b
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
              airflow db migrate
              airflow users create \
                --username admin \
                --firstname MLOps \
                --lastname Student \
                --role Admin \
                --email admin@mlops.local \
                --password "${AIRFLOW_ADMIN_PASSWORD}" || true
          envFrom:
            - configMapRef:
                name: airflow-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: AIRFLOW__WEBSERVER__SECRET_KEY
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: AIRFLOW_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi