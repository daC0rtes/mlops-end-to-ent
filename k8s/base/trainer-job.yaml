apiVersion: batch/v1
kind: Job
metadata:
  name: property-price-training
  namespace: mlops
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: property-trainer
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: dac0rtes/mlops-property-trainer:sha-9b45bd8560a3153cc93b8acba9fc09ebcb268fbf
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_COMMIT
              value: "9b45bd8560a3153cc93b8acba9fc09ebcb268fbf"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
