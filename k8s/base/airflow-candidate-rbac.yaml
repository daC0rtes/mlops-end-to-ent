apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-candidate-jobs
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-candidate-jobs
  namespace: mlops
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-candidate-jobs
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: airflow-candidate-jobs
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-candidate-jobs
