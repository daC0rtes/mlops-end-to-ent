apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-smoke
  template:
    metadata:
      labels:
        app: gitops-smoke
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.5-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
